version: '3.8'

# Development / demo stack — uses SQLite, no external database required.
# For production on the VPN server itself, prefer the native install script
# (deploy/ubuntu-24.04-install.sh) so the panel can control
# /etc/ppp/chap-secrets, nginx and systemd directly.

services:
  app:
    build: .
    container_name: vpnpanel-app
    working_dir: /var/www/html
    environment:
      APP_ENV: 'local'
      APP_DEBUG: 'true'
      APP_KEY: 'base64:change-me'
      VPNPANEL_DRIVER: 'sandbox'
      VPNPANEL_DOMAIN: 'vpn.example.com'
      DB_CONNECTION: 'sqlite'
      DB_DATABASE: '/data/vpnpanel.sqlite'
    volumes:
      - .:/var/www/html
      - vpnpanel-data:/data
      - vpnpanel-storage:/var/www/html/storage
    ports:
      - '8000:80'

volumes:
  vpnpanel-data:
  vpnpanel-storage: