# HTTP-context directives for the VPN Panel.
# Installed to /etc/nginx/conf.d/vpnpanel-http.conf by the installer.
#
# limit_req_zone is only valid in the http {} context, so it lives here
# rather than inside the sites-available vhost.

limit_req_zone $binary_remote_addr zone=vpnpanel_login:10m rate=5r/m;
