# Nginx virtual host for the VPN Panel itself.
# Installed by deploy/ubuntu-24.04-install.sh to
# /etc/nginx/sites-available/vpnpanel (then symlinked into sites-enabled).
#
# The panel separately manages, and owns, these files:
#   /etc/nginx/conf.d/mikrotik.conf   (WebFig http proxy servers)
#   /etc/nginx/stream-proxy.conf      (Winbox stream proxies; included at the
#                                      top level of nginx.conf)
# Do not hand-edit those two.

server {
    listen 80;
    listen [::]:80;
    server_name vpn.example.com;

    root /var/www/vpnpanel/public;
    index index.php;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Rate-limit the login endpoint (zone defined in http context,
    # see deploy/nginx-vpnpanel-http.conf)
    location = /login {
        limit_req zone=vpnpanel_login burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
