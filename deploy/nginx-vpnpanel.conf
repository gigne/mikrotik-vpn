# Nginx virtual host for the VPN Panel itself.
# Place at /etc/nginx/sites-available/vpnpanel and enable with:
#   ln -s /etc/nginx/sites-available/vpnpanel /etc/nginx/sites-enabled/
#
# The panel also manages /etc/nginx/conf.d/mikrotik.conf (stream block +
# WebFig servers) automatically. Do not hand-edit that file.

server {
    listen 80;
    listen [::]:80;
    server_name vpn.example.com;

    root /var/www/vpnpanel/public;
    index index.php;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limit login endpoints
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    location = /login {
        limit_req zone=login_limit burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}