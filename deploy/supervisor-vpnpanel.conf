# VPN Panel worker processes (for the native Ubuntu install)

[supervisord]
nodaemon=false
user=root
logfile=/var/log/vpnpanel/supervisord.log
pidfile=/var/run/vpnpanel-supervisord.pid

[program:vpnpanel-worker]
command=php /var/www/vpnpanel/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=90
directory=/var/www/vpnpanel
user=vpnpanel
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/vpnpanel/worker.log
stderr_logfile=/var/log/vpnpanel/worker.err.log

[program:vpnpanel-scheduler]
command=php /var/www/vpnpanel/artisan schedule:work
directory=/var/www/vpnpanel
user=vpnpanel
numprocs=1
autostart=true
autorestart=true
stdout_logfile=/var/log/vpnpanel/scheduler.log
stderr_logfile=/var/log/vpnpanel/scheduler.err.log