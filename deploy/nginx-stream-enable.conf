# /etc/nginx/modules-enabled/ (Ubuntu 24.04, nginx-extras)
# The mikrotik.conf written by the panel contains a `stream {}` block.
# Ensure the stream module is enabled at the top level:
#   echo "load_module modules/ngx_stream_module.so;" > /etc/nginx/modules-enabled/stream.conf

stream {
    include /etc/nginx/conf.d/mikrotik-stream.conf;
}